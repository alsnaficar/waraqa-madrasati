<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 280px; font-family: sans-serif; background: #0f172a; color: #fff; padding: 14px; text-align: center; }
        .btn { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-green { background: #10b981; color: #fff; }
        .btn-blue { background: #0284c7; color: #fff; }
    </style>
</head>
<body>
    <h3 style="color:#38bdf8; margin-bottom:4px;">ورقة مدرستي 🌿</h3>
    <p style="font-size:11px; color:#94a3b8;">المساعد الذكي للتحضير وإدارة الجدول</p>
    <button class="btn btn-green" onclick="chrome.tabs.reload()">⚡ تفعيل التحضير بالصفحة</button>
    <button class="btn btn-blue" onclick="window.open('https://schools.madrasati.sa')">🌐 فتح منصة مدرستي</button>
</body>
</html>
